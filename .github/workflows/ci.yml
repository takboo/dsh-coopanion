name: Test and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run setup:electron
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright-core install --with-deps chromium
      - run: npm run character:pack -- examples/star paper-star.dshpet
      - name: Verify committed character schema
        run: |
          npm run character:schema
          git diff --exit-code -- docs/character.schema.json
      - run: npm run test:ui
      - run: npm run test:desktop
      - name: Check distributable and create package
        run: |
          npm pack
          node scripts/check-package.mjs
          sha256sum dsh-coopanion-*.tgz paper-star.dshpet > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-pet
          path: |
            artifacts/*.png
            dsh-coopanion-*.tgz
            paper-star.dshpet
            SHA256SUMS
  install:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dsh: ['0.2.0-rc.2', '0.2.1-alpha.1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: desktop-pet
          path: release
      - name: Verify package and install into the published DSH host
        env:
          DSH_TEST_VERSION: ${{ matrix.dsh }}
          DSH_TEST_PACKAGE_DIR: ${{ github.workspace }}/release
        run: |
          cd release
          sha256sum --check SHA256SUMS
          cd ..
          npm run test:install
      - uses: actions/upload-artifact@v4
        with:
          name: installation-${{ matrix.dsh }}
          path: |
            artifacts/install-*.json
            artifacts/installed-*.png
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, install]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e "if ('v' + require('./package.json').version !== process.env.RELEASE_TAG) process.exit(1)"
      - uses: actions/download-artifact@v4
        with:
          name: desktop-pet
          path: release
      - name: Verify and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd release
          sha256sum --check SHA256SUMS
          gh release create "$RELEASE_TAG" dsh-coopanion-*.tgz paper-star.dshpet SHA256SUMS --title "桌宠 $RELEASE_TAG" --notes-file ../docs/release-notes.md
