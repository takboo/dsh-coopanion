<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <title>小鲸 · DeepSeek Harness</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside id="demo" hidden>
    <div class="brand">dsh <span>coopanion</span></div>
    <span class="eyebrow">YOUR LITTLE DESKTOP COMPANION</span>
    <h1>工作的时候，<br>有小鲸陪着。</h1>
    <p>一只住在桌面上的小鲸鱼。<br>点点它、拖着它走，或和它说句话。</p>
    <div class="demo-status"><i></i> 浏览器演示 · 模拟 Harness 事件</div>
    <div class="demo-buttons">
      <button data-demo="thinking">思考</button><button data-demo="working">工作</button><button data-demo="waiting">等你确认</button><button data-demo="happy">任务完成</button><button data-demo="error">遇到问题</button>
    </div>
    <p class="hint">桌面插件会订阅真实任务，无需另填 API Key。</p>
    <div class="demo-footer">DEEPSEEK HARNESS PLUGIN <span>01 / THE WHALE</span></div>
  </aside>
  <main id="stage" aria-label="桌宠活动区域">
    <section id="bubble" class="bubble interactive" hidden aria-live="polite">
      <header><span id="bubble-status">小鲸</span><button id="dismiss" aria-label="收起气泡">×</button></header>
      <p id="bubble-text"></p>
    </section>
    <section id="chat" class="panel interactive" hidden>
      <header><strong id="chat-title">和小鲸说话</strong><button id="chat-close" aria-label="关闭聊天">×</button></header>
      <label for="sessions">发送到 Harness 会话</label>
      <select id="sessions" aria-label="会话"></select>
      <p id="chat-help">消息会发送给所选会话，回复显示在气泡里。</p>
      <form id="chat-form"><textarea id="message" rows="3" maxlength="2000" placeholder="有什么想说的？" aria-label="消息"></textarea><button id="send" type="submit">发送 ↗</button></form>
    </section>
    <section id="menu" class="menu interactive" hidden>
      <button id="open-characters">角色与动画</button>
      <button id="toggle-roam">暂停走动</button>
      <button id="toggle-sleep">休息一下</button>
      <button id="toggle-notices">静音提醒</button>
      <button id="hide">隐藏桌宠</button>
      <small>小鲸 · dsh-coopanion</small>
    </section>
    <section id="characters" class="panel characters interactive" hidden>
      <header><strong>角色与动画</strong><button id="characters-close" aria-label="关闭角色面板">×</button></header>
      <label for="character-select">选择角色</label>
      <select id="character-select" aria-label="角色"></select>
      <div class="character-preview"><canvas id="character-preview" aria-label="角色动画预览"></canvas></div>
      <p id="character-about"></p><p id="character-credit"></p>
      <div class="character-buttons"><button id="character-use">使用角色</button><button id="character-import">导入角色包</button><button id="character-remove" disabled>删除</button></div>
      <input id="character-file" type="file" accept=".dshpet,.zip" hidden>
      <p id="character-status" role="status">导入角色包后可预览并使用，选择会在重启后保留。</p>
    </section>
    <div id="pet" class="pet interactive" data-mood="idle" tabindex="0" role="button" aria-label="小鲸，点击互动，双击聊天，拖动移动">
      <div class="pet-halo"></div>
      <canvas id="character-canvas" aria-hidden="true"></canvas>
      <div id="mood-icon" class="mood-icon" aria-hidden="true">✦</div>
      <div class="pet-toolbar"><button id="open-chat" aria-label="打开聊天">◌</button><button id="open-menu" aria-label="打开桌宠菜单">⋯</button></div>
      <span class="name-tag"><span id="character-name">小鲸</span> <i></i></span>
    </div>
    <button id="toast" class="toast interactive" hidden><span>🐳</span><div><strong id="toast-title"></strong><p id="toast-body"></p></div><b>↗</b></button>
  </main>
  <script src="pet.js" type="module"></script>
</body>
</html>
