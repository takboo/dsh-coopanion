<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小湛 · 喷水与完成庆祝</title><link rel="stylesheet" href="spout-shape-study.css"><link rel="stylesheet" href="reference-celebration-study.css"></head>
<body><main>
<header><div><p class="eyebrow">LITTLE DEEP · 参考动作适配</p><h1>把开心，一口气喷出来。</h1><p class="intro">小湛原造型，参考 Bloop 的弹性喷流、跃起、倾斜和回落庆祝。</p></div><a href="http://localhost:9978/whale-preview.html">用户提供的动作参考 ↗</a></header>
<div class="controls"><label>动作 <select id="action"><option value="celebrate">完成庆祝</option><option value="spout">单独喷水</option></select></label><button id="replay">从头播放</button><button id="play" aria-pressed="false">播放</button><label>配色 <select id="palette"><option value="deep">日光</option><option value="night">夜色</option></select></label><label>实际大小 <input id="size" type="number" min="90" max="240" step="10" value="150"> px</label><button id="blind" aria-pressed="false">遮住分镜文字</button></div>
<div class="motion-pair" id="motion-pair">
<figure><div class="row-title"><h2>正常查看</h2><span id="normal-size">角色大小 300 px</span></div><canvas id="normal" role="img" aria-label="正常尺寸的小湛喷水与庆祝"></canvas><figcaption><strong class="phase">蓄力</strong><span>看喷发、跃起与回落的整体配合。</span></figcaption></figure>
<figure><div class="row-title"><h2>角色实际尺寸</h2><span id="actual-size">宿主设置 150 px · 原比例</span></div><canvas id="actual" role="img" aria-label="实际尺寸的小湛喷水与庆祝"></canvas><figcaption><strong class="phase">蓄力</strong><span>同一只小湛，同一段表演。</span></figcaption></figure>
</div>
<div class="transport"><label for="progress">样片进度</label><input id="progress" type="range" min="0" max="2850" step="1" value="0"><output id="clock">0.00 / 2.85 s</output></div>
<div class="landmarks" id="landmarks"></div><p id="playback-status" aria-live="polite">已暂停，点击从头播放看完整动作。</p>
<footer><p id="score-description">先轻收身体，跃起喷水；倾斜翻回，落散水花和彩虹渐退。单次播放，不自动循环。</p><p>实际尺寸按本轮宿主配置 150 px、角色包原比例绘制，请保持浏览器缩放 100%。隐藏页面暂停，换色和大小保留进度。</p><p>本轮是独立短片候选，尚未接入目标完成主线或更新实机包。身体与引擎沿用 Livelings／小湛；表演参考用户提供的 Bloop 演示。</p></footer>
</main><script type="module" src="reference-celebration-study.js"></script></body></html>
