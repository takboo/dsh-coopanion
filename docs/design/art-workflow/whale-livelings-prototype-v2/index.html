<style>
  :root{--bg:#f4f1e9;--paper:#fffdf8;--ink:#283149;--muted:#83827e;--line:#ddd9cf;--blue:#5578ce;--button:#e9e5db}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}body.dark{--bg:#171d2a;--paper:#222c3e;--ink:#e5eaf6;--muted:#a2abc0;--line:#394256;--blue:#aec5ff;--button:#344157}button,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:var(--button);border-radius:7px;padding:7px 13px}button:hover{filter:brightness(.96)}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:3px}button[aria-pressed=true]{background:var(--ink);color:var(--paper)}main{max-width:1240px;margin:auto;padding:28px 32px 100px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px}.wordmark{font-size:12px;letter-spacing:.10em}.wordmark span{color:var(--muted)}.theme{font-size:12px}h1{font-size:30px;font-weight:550;letter-spacing:-.03em;margin:28px 0 7px}.lead{color:var(--muted);margin:0 0 25px;font-size:13px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap;padding:13px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.states{display:flex;gap:6px;flex-wrap:wrap}.states button{font-size:12px;background:transparent}.states button[aria-pressed=true]{background:var(--ink);color:var(--paper)}.palette{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center}.palette select{font-size:12px;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:5px 7px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;margin-top:24px}.concept{min-width:0}.concept header{display:flex;justify-content:space-between;align-items:center}.concept h2{font-size:19px;font-weight:550;margin:0}.concept header small{font:11px Georgia,serif;color:var(--muted)}.concept header a{font-size:11px;color:var(--muted);text
