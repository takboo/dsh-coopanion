const palettes={round:{body:'#729cff',shade:'#4e7ded',belly:'#e1eeff',outline:'#35588e',cheek:'#e8b8cb'},swim:{body:'#5686ec',shade:'#3d6ac3',belly:'#dfedff',outline:'#2b4b7d',cheek:'#e0adbc'},tail:{body:'#8aaefa',shade:'#5e88df',belly:'#edf3ff',outline:'#3c5d99',cheek:'#e4b4d2'}};

  }

  local(e){const r=this.canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}

    this.age+=dt;this.t+=dt;if(this.state==='done'&&this.age>this.until)this.state='idle';const t=this.t,isThinking=this.state==='thinking',sleep=this.state==='sleep',touch=this.age<this.touchUntil;
    if(moving&&this.age>this.nextBlink){this.blinkAt=this.age;this.nextBlink=this.age+3.1+Math.random()*3.5;}

  drawSwim(g){const c=this.c;g.save();g.translate(78,-3);g.rotate(this.tail.p*.9);path(g,'M-17 -15 C6 -13 17 -26 28 -48 L39 -38 C31 -11 16 11 -9 15 Z',c.body,c.outline);this.fluke(g,33,-51,-.25,.78);g.restore();
    path(g,'M-111 -3 C-109 -29 -83 -48 -41 -48 C4 -49 30 -31 57 -18 C70 -14 80 -14 86 -11 C82 6 69 20 47 29 C12 47 -49 48 -83 32 C-102 24 -111 11 -111 -3 Z',c.body,c.outline);path(g,'M-108 5 C-67 23 -8 19 52 8 Q66 6 76 -2 C57 23 18 39 -29 39 C-67 39 -97 25 -108 5 Z',c.belly);curve(g,'M-88 14 Q-51 29 -9 24',c.shade,1.2);curve(g,'M-85 20 Q-52 34 -13 29',c.shade,1.1);g.save();g.translate(5,15);g.rotate(Math.sin(this.t*1.2)*.13+this.tail.p*.35);path(g,'M-10 -9 C-7 6 8 28 24 29 C32 25 12 10 11 -5 Z',c.shade,c.outline,2.1);g.restore();path(g,'M6 -38 Q16 -57 25 -29',c.body,c.outline,2.1);curve(g,'M-77 -32 Q-62 -39 -47 -37','#91b2fa',3.5);this.eye(g,-78,-6,4.4,5.8);curve(g,this.expression==='thinking'?'M-108 5 Q-98 9 -91 7':'M-109 5 Q-98 15 -88 8',c.outline,2);ellipse(g,-68,7,6,2.7,c.cheek);

  drawTail(g){const c=this.c;g.save();g.translate(0,-39);g.rotate(this.tail.p);path(g,'M-11 8 C-8 -6 -3 -22 -7 -37 L6 -40 C13 -17 8 -2 10 12 Z',c.body,c.outline);this.fluke(g,-1,-42,-.12,.91);g.restore();

  draw(){
    const{g,w,h,dpr}=this;if(!w||!h)return;g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h);const scale=Math.min(bodySize/(this.kind==='swim'?215:this.kind==='round'?165:125),w/(this.kind==='swim'?300:270),(h-80)/210);
    const baseY=h*.49+(this.kind==='tail'?22:0);const cx=w/2+this.x.p,cy=baseY+this.y.p+this.dive.p*scale*100;const night=theme==='night';this.geometry={cx,cy,s:scale};
    if(this.kind==='tail'&&this.dive.p>.01){g.save();g.globalAlpha=this.dive.p*.7;for(let i=0;i<3;i++){g.strokeStyle=night?'#6a8ab5':'#b7ccef';g.lineWidth=1.4;g.beginPath();g.ellipse(w/2,baseY+35*scale,(40+i*12+Math.sin(this.t*2+i)*3)*scale,(5+i*2)*scale,0,0,Math.PI*2);g.stroke();}g.restore();}
    g.save();g.globalAlpha=.13*(1-this.dive.p);ellipse(g,w/2,h*.81,(this.kind==='swim'?78:55)*scale,5*scale,night?'#9eb9ed':'#698ac9');g.restore();
    g.save();if(this.kind==='tail'&&this.dive.p>.01){g.beginPath();g.rect(0,0,w,baseY+36*scale);g.clip();}g.translate(cx,cy);g.rotate(this.angle.p);g.scale(scale*(1+this.squash.p),scale*(1-this.squash.p));if(this.kind==='round')this.drawRound(g);else if(this.kind==='swim')this.drawSwim(g);else this.drawTail(g);g.restore();
    g.save();g.translate(cx,baseY);g.scale(scale,scale);for(const p of this.parts){g.save();g.globalAlpha=Math.sin(Math.min(1,p.life/p.max)*Math.PI)*.8;g.translate(p.x,p.y);if(p.kind==='heart'){g.scale(p.size/8,p.size/8);path(g,'M0 5 C-17 -3 -7 -17 0 -8 C7 -17 17 -3 0 5 Z',night?'#e0a5c6':'#dca3bf');}else if(p.kind==='spark'){g.rotate(p.life*.5);curve(g,`M${-p.size} 0H${p.size} M0 ${-p.size}V${p.size}`,night?'#b9ccff':'#8eaeea',1.8);}else{g.strokeStyle=night?'#a6bfef':'#9bb9e9';g.lineWidth=1.7;g.beginPath();g.arc(0,0,p.size,0,Math.PI*2);g.stroke();}g.restore();}g.restore();
    if(this.state==='thinking'&&this.kind!=='tail'){g.save();g.globalAlpha=.65;for(let i=0;i<3;i++)ellipse(g,cx-25+i*10,baseY-85*scale-(moving?Math.sin(this.t*3-i*.6)*2:0),2.1,2.1,night?'#a9c2f3':'#86a5da');g.restore();}
    if(this.state==='sleep'){g.save();g.fillStyle=night?'#9db3d9':'#91a6c8';g.font='14px Georgia';g.globalAlpha=.6;g.fillText('z',cx+55*scale,baseY-30*scale-(moving?Math.sin(this.t)*2:0));g.font='10px Georgia';g.fillText('z',cx+66*scale,baseY-48*scale-(moving?Math.sin(this.t+.7)*3:0));g.restore();}
  }
}
const whales=$$('.study').map((a,i)=>new Whale(a,i));
whales.forEach(w=>{const b=document.createElement('button');b.className='pet-button';b.type='button';b.textContent='摸摸 ♡';b.setAttribute('aria-label','摸摸'+({round:'团团',swim:'游游',tail:'尾尾'}[w.kind]));b.addEventListener('click',()=>w.react('pet'));w.article.querySelector('.traits').append(b);});
window.addEventListener('pointermove',e=>{pointer.x=e.clientX;pointer.y=e.clientY;},{passive:true});window.addEventListener('blur',()=>{pointer.x=-10000;pointer.y=-10000;});
let doneTimer;function setCommon(state){clearTimeout(doneTimer);commonState=state;whales.forEach(w=>w.setState(state));$$('[data-action]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.action===state));if(state==='done')doneTimer=setTimeout(()=>setCommon('idle'),2700);}
$$('[data-action]').forEach(b=>b.addEventListener('click',()=>setCommon(b.dataset.action)));
$('#theme').addEventListener('click',()=>{theme=theme==='day'?'night':'day';document.body.dataset.theme=theme;$('#theme').textContent=theme==='night'?'日光':'夜色';$('#theme').setAttribute('aria-pressed',theme==='night');});
function syncMotion(){ $('#motion').textContent=moving?'动态开启':'减少动态';$('#motion').setAttribute('aria-pressed',moving); }
$('#motion').addEventListener('click',()=>{moving=!moving;if(!moving)whales.forEach(w=>{w.parts=[];w.blinkAt=-99;});syncMotion();});syncMotion();
$('#size').addEventListener('input',e=>{bodySize=+e.target.value;$('#size-value').textContent=bodySize+' px';});
const views=['all','round','swim','tail'];function setView(v){view=views.includes(v)?v:'all';$('.studies').classList.toggle('focused',view!=='all');whales.forEach(w=>{w.article.hidden=view!=='all'&&w.kind!==view;});$$('[data-view]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===view));const url=new URL(location.href);url.searchParams.set('variant',view);history.replaceState(null,'',url);requestAnimationFrame(()=>whales.forEach(w=>w.resize()));}
$$('[data-view]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));$$('[data-focus]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.focus)));function cycle(d){setView(views[(views.indexOf(view)+d+views.length)%views.length]);}$('#previous').onclick=()=>cycle(-1);$('#next').onclick=()=>cycle(1);window.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,[contenteditable=true]'))return;if(e.key==='ArrowLeft'){e.preventDefault();cycle(-1);}if(e.key==='ArrowRight'){e.preventDefault();cycle(1);}});setView(new URLSearchParams(location.search).get('variant')||'all');
let last=0;function animate(now){const dt=last?Math.min((now-last)/1000,.04):.016;last=now;if(!document.hidden)whales.forEach(w=>{if(!w.article.hidden)w.update(dt);});requestAnimationFrame(animate);}requestAnimationFrame(animate);
